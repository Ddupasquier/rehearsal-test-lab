name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  layout:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm run check

  published-onboarding:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Verify the currently published beta
        run: |
          tarball="$(npm pack @rehearsal-db/core@beta --silent --pack-destination "$RUNNER_TEMP")"
          npm run onboarding:verify -- "$RUNNER_TEMP/$tarball"
