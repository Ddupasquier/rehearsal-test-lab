name: Check lab

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Daily observation run at 09:30 Pacific during daylight-saving time.
    - cron: "30 16 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  layout:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run candidate:verify -- --help
      - run: npm run upgrade:verify -- --help
      - run: npm run adoption:verify -- --help

  postgresql-fixture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm run postgresql:start
      - run: npm run postgresql:verify
      - if: always()
        run: docker compose -f projects/postgresql/compose.yaml down
      - if: always()
        run: docker volume rm rehearsal_lab_postgresql || true

  published-adoption:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - name: Verify the currently published prerelease channel
        run: |
          tarball="$(npm pack @rehearsal-db/core@beta --silent --pack-destination "$RUNNER_TEMP")"
          npm run adoption:verify -- "$RUNNER_TEMP/$tarball"
          npm run onboarding:verify -- "$RUNNER_TEMP/$tarball"
